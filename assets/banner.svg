<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient id="redGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF3B3B"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>

  <!-- Borda -->
  <rect x="1" y="1" width="1198" height="298" rx="17"
        stroke="#30363D" stroke-width="2"/>

  <!-- Detalhes decorativos -->
  <circle cx="1080" cy="70" r="170" fill="#E53935" opacity="0.035"/>
  <circle cx="1080" cy="70" r="110" fill="#E53935" opacity="0.045"/>

  <path d="M850 250 C940 170 1030 280 1200 160"
        stroke="#E53935"
        stroke-opacity="0.10"
        stroke-width="2"/>

  <path d="M800 270 C930 180 1050 290 1200 190"
        stroke="#E53935"
        stroke-opacity="0.06"
        stroke-width="2"/>

  <!-- Barra lateral -->
  <rect x="55" y="65" width="5" height="170" rx="2.5"
        fill="url(#redGradient)"/>

  <!-- Nome -->
  <text x="90" y="120"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="2">
    KALYEL
  </text>

  <text x="90" y="174"
        fill="#E53935"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="2">
    BARBOSA
  </text>

  <!-- Formação -->
  <text x="92" y="211"
        fill="#C9D1D9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18">
    Estudante de Sistemas de Informação
  </text>

  <!-- Áreas -->
  <text x="92" y="242"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        letter-spacing="1">
    TECNOLOGIA  •  AUTOMAÇÃO  •  MELHORIA DE PROCESSOS
  </text>

  <!-- Símbolo de código -->
  <g transform="translate(990 102)" filter="url(#glow)">
    <path d="M25 0 L0 25 L25 50"
          stroke="#E53935"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M75 0 L100 25 L75 50"
          stroke="#E53935"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M60 -8 L40 58"
          stroke="#F85149"
          stroke-width="6"
          stroke-linecap="round"/>
  </g>

  <!-- Status -->
  <circle cx="1000" cy="205" r="5" fill="#E53935"/>

  <text x="1015" y="211"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Em constante aprendizado
  </text>

  <!-- Linha inferior -->
  <rect x="90" y="267" width="1020" height="2" rx="1" fill="#21262D"/>
  <rect x="90" y="267" width="220" height="2" rx="1" fill="#E53935"/>

</svg>
